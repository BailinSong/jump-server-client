minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.33"
  - "@ai-sdk/provider-utils@5.0.16"
  - "@ai-sdk/vue@4.0.44"
  - ai@7.0.44
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - tinyclip@0.1.13
  - tinyexec@1.2.2

packages:
  - .
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

patchedDependencies:
  guacamole-common-js-jumpserver@1.1.0-c: patches/guacamole-common-js-jumpserver@1.1.0-c.patch
